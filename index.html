<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Jardin Extraordinaire</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2e5d4f;
  --secondary:#c9b58c;
  --bg:#f5f9f6;
  --text:#2b3a2a;
  --accent:#a67c52;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
}
header{
  background:var(--primary);
  color:#fff;
  padding:1rem 2rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{
  font-family:'Playfair Display',serif;
  font-size:1.8rem;
  margin:0;
}
header nav a{
  color:#fff;
  text-decoration:none;
  margin-left:1.5rem;
  font-weight:600;
}
.hero{
  background:linear-gradient(rgba(46,93,79,0.6),rgba(46,93,79,0.6)),url('data:image/svg+xml,%3Csvg width%3D"800" height%3D"600" xmlns%3D"http://www.w3.org/2000/svg"%3E%3Crect width%3D"800" height%3D"600" fill%3D"%23c9b58c"%2F%3E%3Ccircle cx%3D"400" cy%3D"300" r%3D"200" fill%3D"%236e8c78"%2F%3E%3C%2Fsvg%3E');
  background-size:cover;
  background-position:center;
  color:#fff;
  text-align:center;
  padding:6rem 2rem;
}
.hero h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,8vw,5rem);
  margin-bottom:.5rem;
}
.hero p{
  font-size:1.125rem;
  max-width:45ch;
  margin:auto;
}
.cta{
  display:inline-block;
  margin-top:1.5rem;
  padding:.75rem 1.5rem;
  background:var(--secondary);
  color:var(--primary);
  text-decoration:none;
  border-radius:999px;
  font-weight:600;
}
.main{
  padding:2rem;
}
.grid{
  display:grid;
  gap:1.5rem;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
}
.card{
  background:#fff;
  border-radius:12px;
  padding:1.5rem;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}
.card h2{
  font-family:'Playfair Display',serif;
  font-size:1.4rem;
  margin-bottom:.5rem;
  color:var(--primary);
}
footer{
  background:var(--primary);
  color:#fff;
  text-align:center;
  padding:2rem 1rem;
  font-size:.9rem;
}
footer a{
  color:#fff;
  text-decoration:underline;
}
section{
  margin-bottom:3rem;
}
.visually-hidden{
  position:absolute;
  clip:rect(0 0 0 0);
  width:1px;
  height:1px;
  overflow:hidden;
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>
<body>
<header>
  <h1>LE JARDIN</h1>
  <nav aria-label="Κύρια πλοήγηση">
    <a href="#menu">Μενού</a>
    <a href="#location">Τοποθεσία</a>
    <a href="#hours">Ωράριο</a>
    <a href="#contact">Επικοινωνία</a>
  </nav>
</header>

<main class="main">
  <section class="hero" aria-label="Καλωσόρισμα">
    <h1>A little garden in the city.</h1>
    <p>A calmer, more premium web presence for coffee, cocktails and long evenings in Thessaloniki.</p>
    <a class="cta" href="tel:+302310264180">Call 2310 264 180</a>
  </section
